server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name venue-os.wotaro.co.uk;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name venue-api.wotaro.co.uk;

    location / {
        proxy_pass http://backend:8080;
    }
}